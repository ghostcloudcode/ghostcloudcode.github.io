<script>
function syncFetch(id, url) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
    document.getElementById(id).innerText = id + ' [' + xhr.status + '] ' + xhr.responseText.substr(0, 800);
  } catch(e) {
    document.getElementById(id).innerText = id + ' [ERR] ' + e.name + ':' + e.message.substr(0,200);
  }
}

setTimeout(function() {
  // Known endpoint paths
  syncFetch('r1', 'https://hz-app-attribute-store.adobe.io/');
  syncFetch('r2', 'https://hz-app-attribute-store.adobe.io/api/v1/attributes');
  syncFetch('r3', 'https://hz-brand-md-service.adobe.io/');
  syncFetch('r4', 'https://hz-brand-md-service.adobe.io/api/v1/brands');
  syncFetch('r5', 'https://hz-app-attribute-store.adobe.io/actuator');
  syncFetch('r6', 'https://hz-app-attribute-store.adobe.io/actuator/env');
  syncFetch('r7', 'https://hz-app-attribute-store.adobe.io/actuator/info');
  syncFetch('r8', 'https://hz-brand-md-service.adobe.io/actuator/env');
}, 0);
</script>
