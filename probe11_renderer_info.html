<!DOCTYPE html>
<html><body>
<h1>RENDERER_INFO_PROBE</h1>
<div id="r1">INITIAL</div>
<div id="r2">INITIAL</div>
<div id="r3">INITIAL</div>
<div id="r4">INITIAL</div>
<div id="r5">INITIAL</div>
<script>
function syncFetch(id, url) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
    document.getElementById(id).innerText = id + ' [' + xhr.status + '] HDRS:' + xhr.getAllResponseHeaders().substr(0,300) + ' BODY:' + xhr.responseText.substr(0, 1500);
  } catch(e) {
    document.getElementById(id).innerText = id + ' [ERR] ' + e.message.substr(0,200);
  }
}

setTimeout(function() {
  // Get renderer's outgoing IP and headers
  syncFetch('r1', 'https://httpbin.org/get');
  // Get renderer's environment info  
  syncFetch('r2', 'https://httpbin.org/headers');
  // Check what IP the renderer exits from
  syncFetch('r3', 'https://httpbin.org/ip');
  // User agent
  syncFetch('r4', 'https://httpbin.org/user-agent');
  // Check if Squid adds proxy headers
  syncFetch('r5', 'https://httpbin.org/anything');
}, 0);
</script>
</body></html>
