<!DOCTYPE html>
<html><body>
<h1>WEBRTC_IP_LEAK_TEST</h1>
<div id="r1">INITIAL</div>
<script>
setTimeout(function() {
  var candidates = [];
  try {
    var pc = new RTCPeerConnection({
      iceServers: [{urls: "stun:stun.l.google.com:19302"}]
    });
    pc.createDataChannel('leak');
    pc.onicecandidate = function(e) {
      if (e.candidate) {
        candidates.push(e.candidate.candidate);
        document.getElementById('r1').innerText = 'CANDIDATES[' + candidates.length + ']:' + candidates.join('\n');
      } else {
        document.getElementById('r1').innerText = 'ICE_COMPLETE[' + candidates.length + ']:' + candidates.join('\n');
      }
    };
    pc.createOffer().then(function(offer) {
      pc.setLocalDescription(offer);
      // Extract from SDP
      var sdp = offer.sdp;
      var ips = sdp.match(/(\d{1,3}\.){3}\d{1,3}/g) || [];
      var ipv6 = sdp.match(/([0-9a-f]{1,4}:){2,7}[0-9a-f]{1,4}/gi) || [];
      document.getElementById('r1').innerText = 'SDP_IPs:' + ips.join(',') + ' IPv6:' + ipv6.join(',') + ' SDP_EXCERPT:' + sdp.substr(0, 2000);
    }).catch(function(e) {
      document.getElementById('r1').innerText = 'OFFER_ERR:' + e.message;
    });
  } catch(e) {
    document.getElementById('r1').innerText = 'RTC_ERR:' + e.name + ':' + e.message;
  }
}, 0);
</script>
</body></html>
