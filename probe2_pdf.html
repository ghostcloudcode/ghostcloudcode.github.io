<script>
function syncFetch(id, url) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
    document.getElementById(id).innerText = id + ' [' + xhr.status + '] ' + xhr.responseText.substr(0, 800);
  } catch(e) {
    document.getElementById(id).innerText = id + ' [ERR] ' + e.name + ':' + e.message.substr(0,200);
  }
}

setTimeout(function() {
  syncFetch('r1', 'https://pdf-services.adobe.io/');
  syncFetch('r2', 'https://pdf-services-ue1.adobe.io/');
  syncFetch('r3', 'https://cpf-ue1.adobe.io/');
  syncFetch('r4', 'https://dc-api.adobe.io/');
  syncFetch('r5', 'https://acrobat-mcp.adobe.io/');
  syncFetch('r6', 'https://ims-na1.adobelogin.com/ims/token_info');
  syncFetch('r7', 'https://ims-na1.adobelogin.com/.well-known/openid-configuration');
  syncFetch('r8', 'https://adobeid-na1.services.adobe.com/');
}, 0);
</script>
