<!DOCTYPE html>
<html><body>
<h1>WH_ADOBE_IO_PROBE</h1>
<div id="r1">INITIAL</div>
<div id="r2">INITIAL</div>
<div id="r3">INITIAL</div>
<div id="r4">INITIAL</div>
<div id="r5">INITIAL</div>
<div id="r6">INITIAL</div>
<script>
function syncFetch(id, url) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
    document.getElementById(id).innerText = id + ' [' + xhr.status + '] ' + xhr.responseText.substr(0, 800);
  } catch(e) {
    document.getElementById(id).innerText = id + ' [ERR] ' + e.name + ':' + e.message.substr(0,200);
  }
}

setTimeout(function() {
  syncFetch('r1', 'https://wh.adobe.io/health');
  syncFetch('r2', 'https://wh.adobe.io/version');
  syncFetch('r3', 'https://wh.adobe.io/v3/api-docs');
  syncFetch('r4', 'https://wh.adobe.io/swagger-ui.html');
  syncFetch('r5', 'https://wh.adobe.io/actuator');
  syncFetch('r6', 'https://wh.adobe.io/actuator/health');
}, 0);
</script>
</body></html>
