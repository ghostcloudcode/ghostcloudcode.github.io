<!DOCTYPE html>
<html><body>
<h1>HZ_AUTHED_PROBE</h1>
<div id="r1">INITIAL</div>
<div id="r2">INITIAL</div>
<div id="r3">INITIAL</div>
<div id="r4">INITIAL</div>
<div id="r5">INITIAL</div>
<div id="r6">INITIAL</div>
<script>
function syncFetch(id, url, headers) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    if (headers) {
      for (var k in headers) xhr.setRequestHeader(k, headers[k]);
    }
    xhr.send();
    document.getElementById(id).innerText = id + ' [' + xhr.status + '] ' + xhr.responseText.substr(0, 1000);
  } catch(e) {
    document.getElementById(id).innerText = id + ' [ERR] ' + e.name + ':' + e.message.substr(0,300);
  }
}

setTimeout(function() {
  // Test with Accept: application/json
  syncFetch('r1', 'https://hz-app-attribute-store.adobe.io/health', {'Accept': 'application/json'});
  syncFetch('r2', 'https://hz-app-attribute-store.adobe.io/', {'Accept': 'application/json'});
  syncFetch('r3', 'https://hz-app-attribute-store.adobe.io/swagger-ui.html', {'Accept': 'text/html'});
  syncFetch('r4', 'https://hz-app-attribute-store.adobe.io/v2/api-docs', {'Accept': 'application/json'});
  syncFetch('r5', 'https://hz-app-attribute-store.adobe.io/swagger-resources', {'Accept': 'application/json'});
  syncFetch('r6', 'https://hz-brand-md-service.adobe.io/swagger-ui.html', {'Accept': 'text/html'});
}, 0);
</script>
</body></html>
